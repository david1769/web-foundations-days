
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
  <button id="load-btn" type="button">Load notes</button>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="note-form">
    <label for="title-input">Title</label>
    <input id="title-input" name="title" type="text" placeholder="Note title" maxlength="100" required>
    <label for="body-input">Body</label>
    <textarea id="body-input" name="body" placeholder="Note body"></textarea>
    <button id="submit-btn" type="submit">Create Note</button>
  </form>
  <ul id="notes-list"></ul>
</body>
</html>
